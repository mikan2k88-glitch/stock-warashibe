name: G6 Prospective Shadow Validation

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "30 7 * * 1-5"

permissions:
  contents: read
  id-token: write

jobs:
  shadow-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run full tests
        run: python -m pytest -q
      - name: Record forward-only G6 shadow observations
        run: python scripts/retry_command.py --attempts 3 --delay-seconds 20 -- python shadow_validation.py
