name: Paper Runtime Gates

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "30 8 * * 1-5"

permissions:
  contents: read
  id-token: write

jobs:
  endpoints-038-043:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run full tests
        run: python -m pytest -q
      - name: Run endpoints 038 through 043
        run: python scripts/retry_command.py --attempts 3 --delay-seconds 20 -- python paper_runtime_pipeline.py
