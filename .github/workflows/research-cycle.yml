name: Stock Warashibe Research Cycle

on:
  workflow_dispatch:

concurrency:
  group: stock-warashibe-research-cycle
  cancel-in-progress: false

jobs:
  research-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Run and persist synthetic research cycle
        run: python research_cycle.py
