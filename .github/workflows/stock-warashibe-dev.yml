name: Stock Warashibe Dev Queue
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "23 * * * *"

concurrency:
  group: stock-warashibe-dev-queue
  cancel-in-progress: false

jobs:
  queue-executor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - name: Execute queued development ticket
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python dev_queue_executor.py
